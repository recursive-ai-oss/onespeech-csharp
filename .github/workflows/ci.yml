name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build output directory
        run: echo "ONESPEECH_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OneSpeech.slnx
      - name: Build
        run: dotnet build OneSpeech.slnx -c Release --no-restore
      - name: Test contracts
        run: dotnet test tests/OneSpeech.Tests -c Release --no-build
      - name: Pack
        run: dotnet pack OneSpeech.slnx -c Release --no-build -o "$RUNNER_TEMP/packages"
      - name: Publish NativeAOT smoke
        run: dotnet publish tests/AotSmoke -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/smoke" -warnaserror
      - name: Run NativeAOT smoke
        run: '"$RUNNER_TEMP/smoke/AotSmoke"'
