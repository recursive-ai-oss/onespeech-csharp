[project]
name = "onespeech-qwen3-asr-oracle"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["qwen-asr==0.0.6", "torch==2.15.0", "numpy==2.5.4", "soundfile==0.14.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
