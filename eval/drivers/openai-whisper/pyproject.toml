[project]
name = "onespeech-oracle-openai-whisper"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["openai-whisper==20250625", "torch==2.15.0", "numpy==2.5.4", "soundfile==0.13.1", "librosa==0.11.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
