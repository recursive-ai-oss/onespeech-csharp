[project]
name = "onespeech-pyannote-oracle-gpu"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Same pins as ../pyannote, CUDA wheels of the same torch release (reference runs on long recordings only).
dependencies = ["pyannote-audio==4.0.7", "torch==2.11.0", "torchaudio==2.11.0", "soundfile==0.14.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
